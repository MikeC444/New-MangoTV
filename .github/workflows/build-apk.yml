name: Build debug APK

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mango-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke-test:
    # A green `build` job only proves the code compiles -- it never actually
    # runs the app, so a startup crash (bad DI wiring, a bug that only
    # throws once real code executes, etc.) can ship silently. This job
    # boots a real emulator, installs the just-built APK, launches
    # MainActivity, and fails loudly with the actual stack trace if it
    # crashes within a few seconds of launch, instead of that only being
    # discoverable by a user's device failing to open the app.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mango-tv-debug-apk
          path: app/build/outputs/apk/debug

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, launch, and check for a crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.mangotv.app/.MainActivity
            sleep 15
            adb logcat -d > logcat.txt
            if grep -qE "FATAL EXCEPTION|AndroidRuntime: FATAL" logcat.txt; then
              echo "=== CRASH DETECTED ON LAUNCH ==="
              grep -A 80 -E "FATAL EXCEPTION|AndroidRuntime: FATAL" logcat.txt
              exit 1
            fi
            if ! adb shell "pidof com.mangotv.app" | grep -q '[0-9]'; then
              echo "=== APP PROCESS NOT RUNNING 15s AFTER LAUNCH (crashed or never started) ==="
              tail -n 200 logcat.txt
              exit 1
            fi
            echo "App launched and is still running after 15s -- no crash detected."

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logcat
          path: logcat.txt
          if-no-files-found: ignore
